<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Analytics agent – Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
.wrap{max-width:1360px;margin:0 auto;padding:22px 22px 70px}
.fil{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);margin-bottom:12px}
.fil a{color:var(--t2)} .fil a:hover{color:var(--t1)}
.entete .etat{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:1px}
.segment{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.segment button{border:0;background:none;height:32px;padding:0 13px;font-size:12.5px;font-weight:500;color:var(--t2)}
.segment button + button{border-left:1px solid var(--line-2)}
.segment button[aria-pressed="true"]{background:var(--bleu-f);color:#dbe8ff}
.tuiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}
.tuile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;display:grid;gap:4px}
.tuile > span:first-child{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--t2)}
.tuile > span:first-child::before{content:"";width:8px;height:12px;background:radial-gradient(circle,#4a5163 1.15px,transparent 1.35px) 0 0/4px 4px}
.tuile strong{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.15}
.tuile strong u{text-decoration:none;font-size:15px;color:var(--t3);margin-left:3px;font-weight:500}
.delta{font-size:11.5px;font-weight:600;color:var(--t3)}
.delta.mieux{color:#4ade80} .delta.moins{color:#f87171}
.grille-a{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.carte{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 18px;min-width:0;box-shadow:0 12px 30px -18px rgba(0,0,0,.8)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
.carte .w-tete{margin-bottom:8px}
.carte .valeur{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.carte .valeur u{text-decoration:none;font-size:13px;font-weight:500;color:var(--t3);margin-left:6px}
.carte .sous{font-size:12px;color:var(--t3);margin-top:2px}
.graph{position:relative;margin-top:12px;height:210px}
.graph.petit{height:165px}
.graph svg{display:block;width:100%;height:100%;overflow:visible}
.graph text{fill:var(--t3);font-size:10.5px;font-family:var(--f)}
.legende{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-top:10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:8px;height:8px;border-radius:2px}
.bulle-info{position:fixed;z-index:50;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 14px 34px rgba(0,0,0,.6);min-width:120px;transform:translate(-50%,calc(-100% - 14px))}
.bulle-info b{display:block;font-size:11px;color:var(--t3);font-weight:500;margin-bottom:3px}
.bulle-info div{display:flex;justify-content:space-between;gap:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bulle-info div span{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--t2)}
.bulle-info div span i{width:8px;height:8px;border-radius:2px}
.anneau{display:flex;align-items:center;gap:20px;margin-top:14px}
.anneau svg{flex:none}
.anneau ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:13px;flex:1}
.anneau li{display:flex;align-items:center;gap:8px;color:var(--t2)}
.anneau li i{width:8px;height:8px;border-radius:2px}
.anneau li b{color:var(--t1);font-variant-numeric:tabular-nums;margin-left:auto;padding-left:12px}
.liste{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:11px}
.liste li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:13px}
.liste li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
.liste li b{font-variant-numeric:tabular-nums;font-weight:600}
.liste li i{grid-column:1/-1;display:block;height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.liste li i::after{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:3px}
.carte-activite{display:grid;grid-template-columns:30px repeat(24,minmax(0,1fr));gap:5px;margin-top:14px;align-items:center}
.carte-activite span{font-size:10.5px;color:var(--t3)}
.carte-activite i{display:block;height:13px;border-radius:4px;background:var(--panel-3)}
.carte-activite .h{text-align:center}
.carte .tableau{overflow-x:auto;margin:6px -16px -18px}
.carte table{min-width:640px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td:first-child{white-space:nowrap}
.vide{color:var(--t3);padding:26px 0;text-align:center}
.attente{min-height:60vh;display:grid;place-items:center;color:var(--t3)}
.bientot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:40px 28px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:12px}
.bientot h2{font-size:18px;font-weight:600}
.bientot p{color:var(--t2);max-width:520px}
@media (max-width:980px){ .tuiles{grid-template-columns:repeat(2,minmax(0,1fr))} .c8,.c6,.c4{grid-column:span 12} }
@media (max-width:560px){ .wrap{padding:14px 14px 50px} .tuile strong{font-size:24px} .anneau{flex-direction:column;align-items:flex-start} .carte-activite{gap:2px;grid-template-columns:26px repeat(24,minmax(0,1fr))} .entete .actions{margin-left:0} }
</style>
</head>
<body>
<main class="wrap">
  <nav class="fil" aria-label="Fil d'Ariane"><a href="index.html#agents">Carte des agents</a><span>/</span><span id="fil-nom">Analytics</span></nav>
  <div class="attente" id="attente">Chargement des données…</div>
  <div id="contenu" hidden>
    <div class="entete">
      <span class="tuile-ic" id="ic"></span>
      <div><h1><span id="h-nom"></span><span class="etat pill" id="h-etat"></span></h1><p id="h-role"></p></div>
      <div class="actions">
        <div class="segment" role="group" aria-label="Période" id="periode">
          <button data-p="7" aria-pressed="false">7 jours</button><button data-p="30" aria-pressed="true">30 jours</button><button data-p="90" aria-pressed="false">90 jours</button>
        </div>
        <button class="btn prim" id="exporter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Exporter le journal</button>
      </div>
    </div>
    <div id="tableau-bord"></div>
  </div>
</main>
<div class="bulle-info" id="info" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="commun.js"></script>
<script src="agents.js"></script>
<script>
const COUL = { bleu: "#3b82f6", vert: "#22c55e", rouge: "#ef4444", gris: "#5b6275", orange: "#f59e0b" };
const code = new URLSearchParams(location.search).get("a");
const AG = AGENTS.find(a => a.code === code);
let RUNS = [], EXTRA = {}, PERIODE = 30;
const cleJour = d => new Date(d).toLocaleDateString("sv-SE");
const courtJour = k => new Date(k + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const duree = r => r.fin ? Math.max(0, (new Date(r.fin) - new Date(r.debut)) / 1000) : null;
const fmtDuree = s => s == null ? "–" : s < 90 ? Math.round(s) + " s" : (s / 60).toFixed(1).replace(".", ",") + " min";

/* ---------- Bulle d'information ---------- */
const info = $("#info");
function montrer(ev, titre, lignes) {
  info.innerHTML = `<b>${esc(titre)}</b>` + lignes.map(([lib, val, c]) => `<div><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(lib)}</span>${esc(val)}</div>`).join("");
  info.hidden = false; info.style.left = Math.min(innerWidth - 90, Math.max(90, ev.clientX)) + "px"; info.style.top = ev.clientY + "px";
}
const cacher = () => info.hidden = true;
const arrondiHaut = m => { if (m <= 10) return 10; const p = 10 ** Math.floor(Math.log10(m)); const n = m / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };

/* ---------- Courbe (une série), avec réticule ---------- */
function courbe(el, pts, { couleur = COUL.bleu, aire = true, fmt = nf, unite = "", reference = null, refLib = "" } = {}) {
  const W = el.clientWidth, H = el.clientHeight, g = 8, d = 44, h = 10, b = 26; if (W < 80) return;
  const max = arrondiHaut(Math.max(1, ...pts.map(p => p.v || 0), reference || 0));
  const X = i => g + (pts.length <= 1 ? (W - g - d) / 2 : i * (W - g - d) / (pts.length - 1)), Y = v => h + (H - h - b) * (1 - v / max);
  const id = "a" + Math.random().toString(36).slice(2, 8);
  const ligne = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.v || 0).toFixed(1)}`).join(" ");
  const graduations = [0, max / 2, max].map(v => `<line x1="${g}" x2="${W - d}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,${v ? .06 : .12})" ${v ? 'stroke-dasharray="2 4"' : ""}/><text x="${W - d + 8}" y="${Y(v) + 4}">${fmt(v)}</text>`).join("");
  const pas = Math.max(1, Math.ceil(pts.length / 6));
  const etiquettes = pts.map((p, i) => (i % pas === 0 || i === pts.length - 1) && !(i !== pts.length - 1 && pts.length - 1 - i < pas * .6) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${esc(p.court || p.lib)}</text>` : "").join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${couleur}" stop-opacity=".32"/><stop offset="1" stop-color="${couleur}" stop-opacity="0"/></linearGradient></defs>
    ${graduations}${etiquettes}
    ${reference != null ? `<line x1="${g}" x2="${W - d}" y1="${Y(reference)}" y2="${Y(reference)}" stroke="${COUL.orange}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - d - 4}" y="${Y(reference) - 6}" text-anchor="end" style="fill:${COUL.orange}">${esc(refLib)}</text>` : ""}
    ${aire && pts.length > 1 ? `<path d="${ligne} L${X(pts.length - 1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="url(#${id})"/>` : ""}
    <path d="${ligne}" fill="none" stroke="${couleur}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length === 1 ? `<circle cx="${X(0)}" cy="${Y(pts[0].v || 0)}" r="4" fill="${couleur}"/>` : ""}
    <g class="curseur" visibility="hidden"><line y1="${h}" y2="${H - b}" stroke="rgba(255,255,255,.35)"/><circle r="5" fill="${couleur}" stroke="#0e1016" stroke-width="2"/></g>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.firstChild, cur = svg.querySelector(".curseur");
  const survol = ev => { const r = svg.getBoundingClientRect(), x = ev.clientX - r.left; let i = pts.length <= 1 ? 0 : Math.round((x - g) / ((W - g - d) / (pts.length - 1))); i = Math.max(0, Math.min(pts.length - 1, i));
    cur.setAttribute("visibility", "visible"); cur.querySelector("line").setAttribute("x1", X(i)); cur.querySelector("line").setAttribute("x2", X(i)); cur.querySelector("circle").setAttribute("cx", X(i)); cur.querySelector("circle").setAttribute("cy", Y(pts[i].v || 0));
    montrer(ev, pts[i].lib, [[unite || "Valeur", pts[i].v == null ? "–" : fmt(pts[i].v), couleur]]); };
  svg.addEventListener("pointermove", survol); svg.addEventListener("pointerleave", () => { cur.setAttribute("visibility", "hidden"); cacher(); });
}

/* ---------- Barres (empilées si plusieurs séries) ---------- */
function barres(el, cats, series, { fmt = nf } = {}) {
  const W = el.clientWidth, H = el.clientHeight, g = 8, d = 44, h = 10, b = 26; if (W < 80) return;
  const tot = cats.map((_, i) => series.reduce((s, se) => s + (se.vals[i] || 0), 0));
  const max = arrondiHaut(Math.max(1, ...tot)), Y = v => (H - h - b) * v / max;
  const bande = (W - g - d) / cats.length, larg = Math.max(2, Math.min(22, bande * .62));
  const graduations = [0, max / 2, max].map(v => `<line x1="${g}" x2="${W - d}" y1="${H - b - Y(v)}" y2="${H - b - Y(v)}" stroke="rgba(255,255,255,${v ? .06 : .12})" ${v ? 'stroke-dasharray="2 4"' : ""}/><text x="${W - d + 8}" y="${H - b - Y(v) + 4}">${fmt(v)}</text>`).join("");
  const pas = Math.max(1, Math.ceil(cats.length / 7));
  let marques = "";
  cats.forEach((c, i) => {
    const x = g + i * bande + (bande - larg) / 2; let base = H - b;
    const visibles = series.map(se => se.vals[i] || 0);
    const dernier = visibles.map((v, k) => v > 0 ? k : -1).filter(k => k >= 0).pop();
    series.forEach((se, k) => { const v = visibles[k]; if (!v) return; let hh = Y(v); const haut = k === dernier; const y = base - hh; const r = haut ? Math.min(4, hh, larg / 2) : 0;
      const hEff = Math.max(1, hh - (haut ? 0 : 2)); const yy = base - hEff;
      marques += r ? `<path d="M${x} ${base} V${yy + r} Q${x} ${yy} ${x + r} ${yy} H${x + larg - r} Q${x + larg} ${yy} ${x + larg} ${yy + r} V${base}Z" fill="${se.couleur}"/>` : `<rect x="${x}" y="${yy}" width="${larg}" height="${hEff}" fill="${se.couleur}"/>`;
      base = y; });
    if (i % pas === 0) marques += `<text x="${g + i * bande + bande / 2}" y="${H - 6}" text-anchor="middle">${esc(c.court ?? c.lib)}</text>`;
    marques += `<rect class="zone" data-i="${i}" x="${g + i * bande}" y="${h}" width="${bande}" height="${H - h - b}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramme en barres">${graduations}${marques}</svg>`;
  el.querySelectorAll(".zone").forEach(z => { z.addEventListener("pointermove", ev => { const i = +z.dataset.i; z.setAttribute("fill", "rgba(255,255,255,.05)"); montrer(ev, cats[i].lib, series.map(se => [se.nom, fmt(se.vals[i] || 0), se.couleur])); }); z.addEventListener("pointerleave", () => { z.setAttribute("fill", "transparent"); cacher(); }); });
}

/* ---------- Anneau ---------- */
function anneau(pct, couleur) {
  const r = 52, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct));
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${Math.round(v)} %"><circle cx="70" cy="70" r="${r}" fill="none" stroke="${couleur}" stroke-opacity=".15" stroke-width="11"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${couleur}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 70 70)"/>
    <text x="70" y="77" text-anchor="middle" fill="#eef0f5" font-size="24" font-weight="600" font-family="Geist,Inter,sans-serif">${Math.round(v)} %</text></svg>`;
}
const liste = (items, couleur) => { const max = Math.max(1, ...items.map(x => x.n)); return items.length ? `<ul class="liste">${items.map(x => `<li style="--w:${x.n / max * 100}%;--c:${couleur}"><span title="${esc(x.lib)}">${esc(x.lib)}</span><b>${nf(x.n)}</b><i></i></li>`).join("")}</ul>` : `<p class="vide">Pas encore de données.</p>`; };

/* ---------- Calculs ---------- */
function joursDe(n, decalage = 0) { return [...Array(n)].map((_, i) => cleJour(Date.now() - (n - 1 - i + decalage) * 864e5)); }
function stats(runs) {
  const prod = runs.reduce((s, r) => s + (r.sorties || 0), 0), entr = runs.reduce((s, r) => s + (r.entrees || 0), 0);
  const ds = runs.map(duree).filter(x => x != null), err = runs.filter(r => r.statut === "erreur").length;
  return { n: runs.length, prod, entr, err, reussite: runs.length ? (runs.length - err) / runs.length * 100 : null, duree: ds.length ? ds.reduce((a, b) => a + b, 0) / ds.length : null };
}
function delta(act, prec, { inverse = false, pts = false } = {}) {
  if (act == null || prec == null || (!pts && !prec)) return `<span class="delta">pas de comparaison</span>`;
  const diff = pts ? act - prec : (act - prec) / prec * 100; if (Math.abs(diff) < .5) return `<span class="delta">stable</span>`;
  const mieux = inverse ? diff < 0 : diff > 0;
  return `<span class="delta ${mieux ? "mieux" : "moins"}">${diff > 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(0)} ${pts ? "pts" : "%"} vs période précédente</span>`;
}

/* ---------- Rendu ---------- */
function rendre() {
  const P = PERIODE, debut = new Date(Date.now() - P * 864e5), debutPrec = new Date(Date.now() - 2 * P * 864e5);
  const runs = RUNS.filter(r => new Date(r.debut) >= debut), prec = RUNS.filter(r => new Date(r.debut) >= debutPrec && new Date(r.debut) < debut);
  const S = stats(runs), Sp = 2 * P <= 90 ? stats(prec) : null;
  const jours = joursDe(P), parJour = Object.fromEntries(jours.map(j => [j, []]));
  runs.forEach(r => { const k = cleJour(r.debut); if (parJour[k]) parJour[k].push(r); });
  const lib = k => new Date(k + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" });
  const ratioLib = code === "A-collecteur" ? "% d'avis gardés" : code === "B-tri" ? "offres par client" : "sorties par entrée";
  const ratio = rs => { const e = rs.reduce((s, r) => s + (r.entrees || 0), 0), s = rs.reduce((t, r) => t + (r.sorties || 0), 0); return e ? (code === "A-collecteur" ? s / e * 100 : s / e) : null; };
  const ratioTot = ratio(runs);
  const fmtRatio = v => v == null ? "–" : code === "A-collecteur" ? Math.round(v) + " %" : v.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
  const parHeure = [...Array(24)].map((_, h) => runs.filter(r => new Date(r.debut).getHours() === h).length);
  const chrono = [...runs].reverse().filter(r => duree(r) != null);
  const ok = runs.filter(r => r.statut === "ok").length, vide = runs.filter(r => r.statut === "vide").length;

  let specifique = "";
  if (code === "A-collecteur") {
    const offres = (EXTRA.offres || []).filter(o => new Date(o.collecte_le) >= debut);
    const dep = {}, typ = {}; offres.forEach(o => { (o.departements || []).forEach(d => dep[d] = (dep[d] || 0) + 1); (o.type_marche || "Non précisé").split(",").map(x => x.trim()).filter(Boolean).forEach(t => typ[t] = (typ[t] || 0) + 1); });
    const top = (o, n, f = x => x) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([k, v]) => ({ lib: f(k), n: v }));
    const nomD = k => (typeof nomDep === "function" ? nomDep(k) : k) ;
    specifique = `<div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Départements les plus actifs</h2><span class="pill">top 8</span></div><p class="sous">Sur les ${nf(offres.length)} dernières offres collectées de la période</p>${liste(top(dep, 8, k => k + " · " + nomD(k)), COUL.bleu)}</div>
      <div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Types de marché</h2><span class="pill">répartition</span></div><p class="sous">Travaux, services, fournitures</p>${liste(top(typ, 6, t => t.charAt(0) + t.slice(1).toLowerCase()), COUL.bleu)}</div>`;
  }
  if (code === "B-tri") {
    const env = (EXTRA.envoyees || []).filter(x => x.date_envoi >= cleJour(debut)), noms = EXTRA.noms || {};
    const parC = {}; env.forEach(x => parC[x.client_id] = (parC[x.client_id] || 0) + 1);
    const notes = [1, 2, 3, 4, 5].map(n => env.filter(x => Math.round(x.score) === n).length);
    specifique = `<div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Clients servis</h2><span class="pill">top 8</span></div><p class="sous">${nf(env.length)} offres envoyées à ${Object.keys(parC).length} client(s)</p>${liste(Object.entries(parC).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, n]) => ({ lib: noms[id] || "Client", n })), COUL.bleu)}</div>
      <div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Notes données par l'IA</h2><span class="pill">1 à 5</span></div><p class="sous">Pertinence de 1 à 5 des offres envoyées</p><div class="graph petit" id="g-notes"></div></div>`;
    setTimeout(() => barres($("#g-notes"), [1, 2, 3, 4, 5].map(n => ({ lib: "Note " + n, court: String(n) })), [{ nom: "Offres", couleur: COUL.bleu, vals: notes }]));
  }

  $("#tableau-bord").innerHTML = `
    <div class="tuiles">
      <div class="tuile"><span>Exécutions</span><strong>${nf(S.n)}</strong>${Sp ? delta(S.n, Sp.n) : ""}</div>
      <div class="tuile"><span>${esc(AG.sortie.charAt(0).toUpperCase() + AG.sortie.slice(1))}</span><strong>${nf(S.prod)}</strong>${Sp ? delta(S.prod, Sp.prod) : ""}</div>
      <div class="tuile"><span>Taux de réussite</span><strong>${S.reussite == null ? "–" : Math.round(S.reussite)}<u>%</u></strong>${Sp ? delta(S.reussite, Sp.reussite, { pts: true }) : ""}</div>
      <div class="tuile"><span>Durée moyenne</span><strong>${fmtDuree(S.duree)}</strong>${Sp ? delta(S.duree, Sp.duree, { inverse: true }) : ""}</div>
    </div>
    <div class="grille-a">
      <div class="carte c8"><div class="w-tete"><span class="grip"></span><h2>Production</h2><span class="pill">${P} jours</span></div><div class="valeur">${nf(S.prod)}<u>${esc(AG.sortie)}</u></div><p class="sous">Par jour, sur ${P} jours · ${nf(S.entr)} ${esc(AG.entree)}</p><div class="graph" id="g-prod"></div></div>
      <div class="carte c4"><div class="w-tete"><span class="grip"></span><h2>Fiabilité</h2><span class="pill">${P} jours</span></div><p class="sous">Part des exécutions sans erreur</p>
        <div class="anneau">${anneau(S.reussite || 0, S.reussite == null || S.reussite >= 90 ? COUL.bleu : S.reussite >= 70 ? COUL.orange : COUL.rouge)}
        <ul><li><i style="background:${COUL.vert}"></i>Réussies<b>${nf(ok)}</b></li><li><i style="background:${COUL.gris}"></i>Rien à faire<b>${nf(vide)}</b></li><li><i style="background:${COUL.rouge}"></i>Erreurs<b>${nf(S.err)}</b></li></ul></div></div>
      <div class="carte c8"><div class="w-tete"><span class="grip"></span><h2>Exécutions par jour</h2><span class="pill">par jour</span></div><div class="graph petit" id="g-runs"></div>
        <div class="legende"><span><i style="background:${COUL.vert}"></i>Réussies</span><span><i style="background:${COUL.gris}"></i>Rien à faire</span><span><i style="background:${COUL.rouge}"></i>Erreurs</span></div></div>
      <div class="carte c4"><div class="w-tete"><span class="grip"></span><h2>Heures d'activité</h2><span class="pill">par heure</span></div><p class="sous">Exécutions selon l'heure de la journée</p><div class="graph petit" id="g-heures"></div></div>
      <div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Durée d'exécution</h2><span class="pill">${P} jours</span></div><div class="valeur">${fmtDuree(S.duree)}<u>en moyenne</u></div><div class="graph petit" id="g-duree"></div></div>
      <div class="carte c6"><div class="w-tete"><span class="grip"></span><h2>Rendement</h2><span class="pill">${P} jours</span></div><div class="valeur">${fmtRatio(ratioTot)}<u>${code === "A-collecteur" ? "d'avis gardés" : esc(ratioLib)}</u></div><div class="graph petit" id="g-ratio"></div></div>
      <div class="carte c12"><div class="w-tete"><span class="grip"></span><h2>Activité</h2><span class="pill">jour × heure</span></div><p class="sous">Nombre de passages selon le jour de la semaine et l'heure</p><div class="carte-activite" id="g-activite"></div></div>
      ${specifique}
      <div class="carte c12"><div class="w-tete"><span class="grip"></span><h2>Journal des exécutions</h2><span class="pill">20 dernières</span></div><p class="sous">Les 20 plus récentes de la période</p>
        <div class="tableau"><table><thead><tr><th>Début</th><th>Statut</th><th class="n">${esc(AG.entree)}</th><th class="n">${esc(AG.sortie)}</th><th class="n">Durée</th><th>Détail</th></tr></thead><tbody>
        ${runs.slice(0, 20).map(r => { const st = { ok: ["Réussie", COUL.vert], vide: ["Rien à faire", COUL.gris], erreur: ["Erreur", COUL.rouge], en_cours: ["En cours", COUL.orange] }[r.statut] || [r.statut, COUL.gris];
          return `<tr><td>${heure(r.debut)}</td><td><span class="pil" style="color:${st[1]}">${esc(st[0])}</span></td><td class="n">${nf(r.entrees)}</td><td class="n">${nf(r.sorties)}</td><td class="n">${fmtDuree(duree(r))}</td><td style="color:var(--t3)">${esc(r.message || Object.entries(r.details || {}).map(([k, v]) => k + " " + (typeof v === "object" ? JSON.stringify(v) : v)).join(", "))}</td></tr>`; }).join("") || `<tr><td colspan="6" class="vide">Aucune exécution sur la période.</td></tr>`}
        </tbody></table></div></div>
    </div>`;

  const grilleA = [...Array(7)].map(() => Array(24).fill(0)); runs.forEach(r => { const d = new Date(r.debut); grilleA[(d.getDay() + 6) % 7][d.getHours()]++; });
  const maxA = Math.max(1, ...grilleA.flat()), joursS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
  $("#g-activite").innerHTML = grilleA.map((l, j) => `<span>${joursS[j]}</span>` + l.map((n, h) => `<i title="${joursS[j]} ${h} h : ${n} passage(s)" style="${n ? `background:rgba(59,130,246,${(.22 + .78 * n / maxA).toFixed(2)})` : ""}"></i>`).join("")).join("") + `<span></span>` + [...Array(24)].map((_, h) => `<span class="h">${h % 6 === 0 ? h + " h" : ""}</span>`).join("");
  $$(".carte, .tuile").forEach(c => c.insertAdjacentHTML("beforeend", '<span class="coin"></span>'));
  courbe($("#g-prod"), jours.map(k => ({ lib: lib(k), court: courtJour(k), v: parJour[k].reduce((s, r) => s + (r.sorties || 0), 0) })), { unite: AG.sortie });
  barres($("#g-runs"), jours.map(k => ({ lib: lib(k), court: courtJour(k) })), [
    { nom: "Réussies", couleur: COUL.vert, vals: jours.map(k => parJour[k].filter(r => r.statut === "ok" || r.statut === "en_cours").length) },
    { nom: "Rien à faire", couleur: COUL.gris, vals: jours.map(k => parJour[k].filter(r => r.statut === "vide").length) },
    { nom: "Erreurs", couleur: COUL.rouge, vals: jours.map(k => parJour[k].filter(r => r.statut === "erreur").length) }]);
  barres($("#g-heures"), parHeure.map((_, h) => ({ lib: h + " h à " + (h + 1) + " h", court: h % 6 === 0 ? h + " h" : "" })), [{ nom: "Exécutions", couleur: COUL.bleu, vals: parHeure }]);
  if (chrono.length) courbe($("#g-duree"), chrono.map(r => ({ lib: heure(r.debut), court: jour(r.debut), v: duree(r) })), { aire: false, fmt: v => fmtDuree(v), unite: "Durée", reference: S.duree, refLib: "moyenne" });
  else $("#g-duree").innerHTML = `<p class="vide">Pas encore de données.</p>`;
  courbe($("#g-ratio"), jours.map(k => ({ lib: lib(k), court: courtJour(k), v: ratio(parJour[k]) })), { aire: false, fmt: fmtRatio, unite: ratioLib });
}

/* ---------- Démarrage ---------- */
async function demarrer() {
  if (!AG) { location.href = "index.html#agents"; return; }
  const { moi } = await verifierAdmin(); if (!moi) { location.href = "index.html"; return; }
  $("#attente").hidden = true; $("#contenu").hidden = false;
  document.title = AG.nom + " · " + AG.titre + " – Analytics";
  $("#ic").innerHTML = icone(code, 18); $("#h-nom").textContent = AG.titre + " · " + AG.nom; $("#fil-nom").textContent = AG.titre; $("#h-role").textContent = AG.role;
  if (AG.avenir) {
    $("#h-etat").classList.add("ko"); $("#h-etat").textContent = "À construire (" + AG.avenir + ")"; $("#periode").hidden = true; $("#exporter").hidden = true;
    $("#tableau-bord").innerHTML = `<div class="bientot"><span class="tuile-ic" style="width:46px;height:46px">${icone(code, 22)}</span><h2>Cet agent n'est pas encore en service</h2><p>Il arrive en ${esc(AG.avenir)}. Ses statistiques (${esc(AG.entree)}, ${esc(AG.sortie)}, fiabilité, durée) apparaîtront ici dès sa première exécution.</p></div>`;
  } else {
    const req = [SB.from("agent_runs").select("*").eq("agent", code).gte("debut", ilYa(180)).order("debut", { ascending: false }).limit(1000)];
    if (code === "A-collecteur") req.push(SB.from("offres").select("departements,type_marche,collecte_le").order("collecte_le", { ascending: false }).limit(1000));
    if (code === "B-tri") req.push(SB.from("offres_envoyees").select("client_id,date_envoi,score").gte("date_envoi", ilYa(90).slice(0, 10)).order("date_envoi", { ascending: false }).limit(1000), SB.from("profils").select("id,entreprise").limit(2000));
    const res = await Promise.all(req);
    RUNS = res[0].data || [];
    if (code === "A-collecteur") EXTRA.offres = res[1].data || [];
    if (code === "B-tri") { EXTRA.envoyees = res[1].data || []; EXTRA.noms = Object.fromEntries((res[2].data || []).map(p => [p.id, p.entreprise])); }
    const e = sante(AG, RUNS), on = estActif(e);
    $("#h-etat").classList.add(on ? "ok" : "ko"); $("#h-etat").textContent = e.txt; $("#h-role").textContent = AG.role + (e.der ? " Dernier passage le " + heure(e.der.debut) + "." : "");
    rendre();
  }
}
$$("#periode button").forEach(b => b.onclick = () => { PERIODE = +b.dataset.p; $$("#periode button").forEach(x => x.setAttribute("aria-pressed", x === b)); rendre(); });
let attente; addEventListener("resize", () => { clearTimeout(attente); attente = setTimeout(() => !AG?.avenir && RUNS && $("#tableau-bord").children.length && rendre(), 150); });
$("#exporter").onclick = () => {
  const debut = new Date(Date.now() - PERIODE * 864e5), lignes = RUNS.filter(r => new Date(r.debut) >= debut);
  const cel = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = ["debut;fin;statut;" + AG.entree + ";" + AG.sortie + ";message"].concat(lignes.map(r => [r.debut, r.fin, r.statut, r.entrees, r.sorties, r.message].map(cel).join(";"))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" })); a.download = `journal-${code}-${PERIODE}j.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
demarrer().catch(() => { $("#attente").textContent = "Connexion à la base impossible. Réessayez."; });
</script>
